apiVersion: v1
kind: Namespace
metadata:
  name: wafl-system
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: wafl-controller
  namespace: wafl-system
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: wafl-node
  namespace: wafl-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: wafl-controller
rules:
  - apiGroups: [wafl.opt.td]
    resources: [apps, apps/status]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [apps]
    resources: [deployments, replicasets]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [""]
    resources: [namespaces]
    verbs: [get, list, watch]
  - apiGroups: [""]
    resources: [pods, nodes]
    verbs: [get, list, watch, update, delete]
  - apiGroups: [""]
    resources: [pods/status]
    verbs: [update]
  - apiGroups: [""]
    resources: [secrets, configmaps, services]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [discovery.k8s.io]
    resources: [endpointslices]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [coordination.k8s.io]
    resources: [leases]
    verbs: [get, list, watch, create, update, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: wafl-node
rules:
  - apiGroups: [""]
    resources: [pods, pods/status, pods/finalizers, nodes, nodes/status, configmaps, events]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [""]
    resources: [secrets]
    verbs: [get]
  - apiGroups: [coordination.k8s.io]
    resources: [leases]
    verbs: [get, list, watch, create, update, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: wafl-controller
subjects:
  - kind: ServiceAccount
    name: wafl-controller
    namespace: wafl-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: wafl-controller
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: wafl-node
subjects:
  - kind: ServiceAccount
    name: wafl-node
    namespace: wafl-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: wafl-node
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: wafl-runner
  namespace: wafl-system
data:
  runner.json: |
    {"listen":"0.0.0.0:8080","control":"0.0.0.0:8081","directory":"/var/lib/wafl/cache","capacity":{"instances":128,"running":16,"memory_bytes":1073741824}}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: wafl-controller
  namespace: wafl-system
spec:
  replicas: 2
  selector:
    matchLabels: {app.kubernetes.io/part-of: wafl, app.kubernetes.io/component: controller}
  template:
    metadata:
      labels: {app.kubernetes.io/part-of: wafl, app.kubernetes.io/component: controller}
    spec:
      serviceAccountName: wafl-controller
      containers:
        - name: controller
          image: ghcr.io/lesomnus/wafl:latest
          args: [serve, controller, --system-namespace, wafl-system]
          ports:
            - {name: control, containerPort: 8082}
            - {name: activation, containerPort: 8083}
          readinessProbe: {httpGet: {path: /health, port: control}, periodSeconds: 2, timeoutSeconds: 2}
          resources:
            requests: {cpu: 50m, memory: 128Mi}
            limits: {memory: 512Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: wafl-controller
  namespace: wafl-system
spec:
  selector: {app.kubernetes.io/part-of: wafl, app.kubernetes.io/component: controller}
  ports:
    - {name: control, port: 8082, targetPort: control}
    - {name: activation, port: 8083, targetPort: activation}
    - {name: tcp-10000, port: 10000, targetPort: 10000}
    - {name: tcp-10001, port: 10001, targetPort: 10001}
    - {name: tcp-10002, port: 10002, targetPort: 10002}
    - {name: tcp-10003, port: 10003, targetPort: 10003}
    - {name: tcp-10004, port: 10004, targetPort: 10004}
    - {name: tcp-10005, port: 10005, targetPort: 10005}
    - {name: tcp-10006, port: 10006, targetPort: 10006}
    - {name: tcp-10007, port: 10007, targetPort: 10007}
    - {name: tcp-10008, port: 10008, targetPort: 10008}
    - {name: tcp-10009, port: 10009, targetPort: 10009}
    - {name: tcp-10010, port: 10010, targetPort: 10010}
    - {name: tcp-10011, port: 10011, targetPort: 10011}
    - {name: tcp-10012, port: 10012, targetPort: 10012}
    - {name: tcp-10013, port: 10013, targetPort: 10013}
    - {name: tcp-10014, port: 10014, targetPort: 10014}
    - {name: tcp-10015, port: 10015, targetPort: 10015}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: wafl-runner
  namespace: wafl-system
spec:
  replicas: 2
  selector:
    matchLabels: {app.kubernetes.io/part-of: wafl, app.kubernetes.io/component: runner}
  template:
    metadata:
      labels: {app.kubernetes.io/part-of: wafl, app.kubernetes.io/component: runner}
    spec:
      serviceAccountName: wafl-node
      terminationGracePeriodSeconds: 60
      securityContext: {fsGroup: 10001}
      containers:
        - name: runner
          image: ghcr.io/lesomnus/wafl:latest
          args: [serve, runner, --config, /etc/wafl/runner.json, --reservations, /var/lib/wafl/endpoints]
          env:
            - name: WAFL_DIRECT_IP
              valueFrom: {fieldRef: {fieldPath: status.podIP}}
            - name: POD_NAME
              valueFrom: {fieldRef: {fieldPath: metadata.name}}
          lifecycle:
            preStop:
              exec:
                command: [/usr/local/bin/wafl-kube, node-drain, --system-namespace, wafl-system]
          ports: [{name: control, containerPort: 8081}]
          readinessProbe: {tcpSocket: {port: control}, periodSeconds: 2}
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {memory: 2Gi}
          volumeMounts:
            - {name: data, mountPath: /var/lib/wafl}
            - {name: config, mountPath: /etc/wafl, readOnly: true}
        - name: node
          image: ghcr.io/lesomnus/wafl:latest
          args: [serve, node, --system-namespace, wafl-system, --node, "wafl-$(POD_NAME)", --runner, "http://$(POD_IP):8081"]
          env:
            - name: POD_NAME
              valueFrom: {fieldRef: {fieldPath: metadata.name}}
            - name: POD_IP
              valueFrom: {fieldRef: {fieldPath: status.podIP}}
          lifecycle:
            preStop:
              exec:
                command: [/usr/local/bin/wafl-kube, node-drain, --system-namespace, wafl-system]
          resources:
            requests: {cpu: 50m, memory: 128Mi}
            limits: {memory: 512Mi}
      volumes:
        - name: data
          emptyDir: {sizeLimit: 4Gi}
        - name: config
          configMap: {name: wafl-runner}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: wafl-traefik
  namespace: wafl-system
spec:
  replicas: 1
  selector:
    matchLabels: {app.kubernetes.io/part-of: wafl, app.kubernetes.io/component: traefik}
  template:
    metadata:
      labels: {app.kubernetes.io/part-of: wafl, app.kubernetes.io/component: traefik}
    spec:
      containers:
        - name: traefik
          image: ghcr.io/lesomnus/wafl-traefik:latest
          args:
            - --entrypoints.web.address=:8080
            - --entrypoints.tcp-10000.address=:10000
            - --entrypoints.tcp-10001.address=:10001
            - --entrypoints.tcp-10002.address=:10002
            - --entrypoints.tcp-10003.address=:10003
            - --entrypoints.tcp-10004.address=:10004
            - --entrypoints.tcp-10005.address=:10005
            - --entrypoints.tcp-10006.address=:10006
            - --entrypoints.tcp-10007.address=:10007
            - --entrypoints.tcp-10008.address=:10008
            - --entrypoints.tcp-10009.address=:10009
            - --entrypoints.tcp-10010.address=:10010
            - --entrypoints.tcp-10011.address=:10011
            - --entrypoints.tcp-10012.address=:10012
            - --entrypoints.tcp-10013.address=:10013
            - --entrypoints.tcp-10014.address=:10014
            - --entrypoints.tcp-10015.address=:10015
            - --entrypoints.web.transport.respondingtimeouts.readtimeout=0s
            - --entrypoints.web.transport.respondingtimeouts.writetimeout=0s
            - --experimental.localplugins.wafl.modulename=github.com/lesomnus/wafl/traefik
            - --providers.http.endpoint=http://wafl-controller.wafl-system.svc:8082/traefik
            - --providers.http.pollinterval=1s
            - --providers.providersthrottleduration=100ms
          ports: [{name: web, containerPort: 8080}]
          readinessProbe: {tcpSocket: {port: web}, periodSeconds: 2}
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {memory: 256Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: wafl-traefik
  namespace: wafl-system
spec:
  type: NodePort
  selector: {app.kubernetes.io/part-of: wafl, app.kubernetes.io/component: traefik}
  ports:
    - {name: web, port: 80, targetPort: web, nodePort: 30080}
    - {name: tcp-10000, port: 10000, targetPort: 10000, nodePort: 31000}
    - {name: tcp-10001, port: 10001, targetPort: 10001, nodePort: 31001}
    - {name: tcp-10002, port: 10002, targetPort: 10002, nodePort: 31002}
    - {name: tcp-10003, port: 10003, targetPort: 10003, nodePort: 31003}
    - {name: tcp-10004, port: 10004, targetPort: 10004, nodePort: 31004}
    - {name: tcp-10005, port: 10005, targetPort: 10005, nodePort: 31005}
    - {name: tcp-10006, port: 10006, targetPort: 10006, nodePort: 31006}
    - {name: tcp-10007, port: 10007, targetPort: 10007, nodePort: 31007}
    - {name: tcp-10008, port: 10008, targetPort: 10008, nodePort: 31008}
    - {name: tcp-10009, port: 10009, targetPort: 10009, nodePort: 31009}
    - {name: tcp-10010, port: 10010, targetPort: 10010, nodePort: 31010}
    - {name: tcp-10011, port: 10011, targetPort: 10011, nodePort: 31011}
    - {name: tcp-10012, port: 10012, targetPort: 10012, nodePort: 31012}
    - {name: tcp-10013, port: 10013, targetPort: 10013, nodePort: 31013}
    - {name: tcp-10014, port: 10014, targetPort: 10014, nodePort: 31014}
    - {name: tcp-10015, port: 10015, targetPort: 10015, nodePort: 31015}
