apiVersion: apps/v1
kind: Deployment
metadata:
  name: wafl-assets
  namespace: wafl-system
spec:
  replicas: 1
  selector:
    matchLabels: {app.kubernetes.io/part-of: wafl, app.kubernetes.io/component: assets}
  template:
    metadata:
      labels: {app.kubernetes.io/part-of: wafl, app.kubernetes.io/component: assets}
    spec:
      initContainers:
        - name: permissions
          image: ghcr.io/lesomnus/wafl:latest
          command: [/bin/sh, -c, "chown 10001:10001 /assets"]
          securityContext: {runAsUser: 0, runAsGroup: 0}
          volumeMounts: [{name: assets, mountPath: /assets}]
      containers:
        - name: assets
          image: ghcr.io/lesomnus/wafl:latest
          args: [assets, --directory, /assets, --listen, ":8090"]
          ports: [{name: http, containerPort: 8090}]
          volumeMounts: [{name: assets, mountPath: /assets}]
      volumes:
        - name: assets
          hostPath: {path: /wafl-assets, type: DirectoryOrCreate}
---
apiVersion: v1
kind: Service
metadata:
  name: wafl-assets
  namespace: wafl-system
spec:
  selector: {app.kubernetes.io/part-of: wafl, app.kubernetes.io/component: assets}
  ports: [{name: http, port: 8090, targetPort: http}]
---
# Local bootstrap exposes only the controller management API on this port.
apiVersion: v1
kind: Service
metadata:
  name: wafl-control
  namespace: wafl-system
spec:
  type: NodePort
  selector: {app.kubernetes.io/part-of: wafl, app.kubernetes.io/component: controller}
  ports: [{name: control, port: 8082, targetPort: control, nodePort: 30082}]
