apiVersion: v1
kind: Namespace
metadata:
  name: wafl-system
---
apiVersion: v1
kind: Namespace
metadata:
  name: demo
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: wafl-controller
  namespace: wafl-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: wafl-apps
  namespace: demo
rules:
  - apiGroups: [""]
    resources: [secrets]
    verbs: [get]
  - apiGroups: [wafl.opt.td]
    resources: [apps]
    verbs: [get, list, watch, patch]
  - apiGroups: [wafl.opt.td]
    resources: [apps/status]
    verbs: [patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: wafl-apps
  namespace: demo
subjects:
  - kind: ServiceAccount
    name: wafl-controller
    namespace: wafl-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: wafl-apps
