alias: hello
name: Hello WASM
domain: hello.localhost
manifest:
  runtime: wasmtime
  abi: wasip2
  bundle:
    url: http://bundles:8090/hello.tar.gz
  port: 8080
  protocol: http
  memory_bytes: 67108864
  env:
    GREETING: Hello from WAFL
scaling:
  min: 0
  max: 4
  target: 8
  up_ms: 1000
  down_ms: 10000
  idle_ms: 30000
  waiting: 64
  wait_ms: 120000
