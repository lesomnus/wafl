services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: wafl
      POSTGRES_PASSWORD: wafl-example
    healthcheck:
      test: [CMD-SHELL, pg_isready -U postgres -d wafl]
      interval: 2s
      timeout: 2s
      retries: 30
    volumes: [database:/var/lib/postgresql/data]
    networks: [wafl]
  runner1:
    image: ${WAFL_IMAGE:-ghcr.io/lesomnus/wafl:latest}
    command: [serve, runner, /var/lib/wafl/cache, --config, /etc/wafl/runner.json]
    volumes:
      - ./runner1.json:/etc/wafl/runner.json:ro
      - cache:/var/lib/wafl/cache
      - endpoints1:/var/lib/wafl/endpoints
    networks:
      wafl: {ipv4_address: 172.30.73.11}
  runner2:
    image: ${WAFL_IMAGE:-ghcr.io/lesomnus/wafl:latest}
    command: [serve, runner, /var/lib/wafl/cache, --config, /etc/wafl/runner.json]
    volumes:
      - ./runner2.json:/etc/wafl/runner.json:ro
      - cache:/var/lib/wafl/cache
      - endpoints2:/var/lib/wafl/endpoints
    networks:
      wafl: {ipv4_address: 172.30.73.12}
  controller:
    image: ${WAFL_IMAGE:-ghcr.io/lesomnus/wafl:latest}
    command: [serve, controller, --config, /etc/wafl/controller.json]
    depends_on:
      postgres: {condition: service_healthy}
    volumes: [./controller.json:/etc/wafl/controller.json:ro]
    ports: [127.0.0.1:8082:8082]
    networks: [wafl]
  gateway:
    image: ${WAFL_GATEWAY_IMAGE:-ghcr.io/lesomnus/wafl-traefik:latest}
    command: [--configFile=/etc/traefik/traefik.yaml]
    volumes: [./traefik.yaml:/etc/traefik/traefik.yaml:ro]
    ports: [127.0.0.1:8080:8080]
    networks: [wafl]
  bundles:
    image: python:3.13-alpine
    command: [python, -m, http.server, "8090", --bind, 0.0.0.0, --directory, /bundles]
    volumes: [./bundles:/bundles:ro]
    networks: [wafl]
volumes:
  database:
  cache:
  endpoints1:
  endpoints2:
networks:
  wafl:
    ipam:
      config: [{subnet: 172.30.73.0/24}]
