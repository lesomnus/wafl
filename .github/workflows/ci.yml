name: wafl
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.100.0
          components: rustfmt, clippy
          targets: wasm32-wasip2
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: bash scripts/test.sh --tests -- --include-ignored
        env:
          WAFL_TEST_DATABASE_URL: redis://localhost:6379/0
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: false
      - run: go test -race ./...
        working-directory: plugins/traefik
      - run: go test -race ./...
        working-directory: kubernetes
      - name: Install kind
        run: |
          curl -fsSL --retry 3 -o /tmp/kind https://github.com/kubernetes-sigs/kind/releases/download/v0.33.0/kind-linux-amd64
          echo 'aee6151561422756b764a4ae28e7f44cda5af5a9eead3cc9985112b1de8d8e0d  /tmp/kind' | sha256sum --check
          chmod +x /tmp/kind
          sudo mv /tmp/kind /usr/local/bin/kind
      - name: Test native Kubernetes platform with real WASM and Traefik
        run: bash scripts/test-kubernetes.sh
      - name: Kubernetes diagnostics
        if: failure()
        run: |
          export KUBECONFIG="$HOME/.cache/wafl/dev/wafl-test/kubeconfig"
          kubectl get nodes,pods,apps.wafl.opt.td -A
          kubectl -n wafl-system logs -l app.kubernetes.io/component=controller --tail=60
          kubectl -n wafl-system logs -l app.kubernetes.io/component=runner -c node --tail=60
  generated:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.100.0
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: false
      - uses: bufbuild/buf-setup-action@v1
        with:
          version: '1.72.0'
          github_token: ${{ github.token }}
      - run: bash scripts/codegen.sh --check
