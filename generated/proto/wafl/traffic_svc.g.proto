edition = "2023";
package wafl;

import "orm.proto";
import "wafl/app_svc.g.proto";
import "wafl/payday/tenant_svc.g.proto";
import "wafl/placement_svc.g.proto";
import "wafl/traffic.proto";

option go_package = "github.com/lesomnus/wafl/proto/wafl";

service TrafficService {
  // Add creates a new Traffic
  rpc Add(TrafficAddRequest) returns (Traffic);
  // Get retrieves a Traffic
  rpc Get(TrafficGetRequest) returns (Traffic);
  // List reads Traffics a page at a time.
  rpc List(TrafficListRequest) returns (TrafficListResponse);
  rpc Report(TrafficReportRequest) returns (Traffic);
  // Operator recovery only, after this observer and every connection it owned
  // have stopped. A heartbeat timeout alone is never sufficient evidence.
  rpc Close(TrafficCloseRequest) returns (Traffic);
}

message TrafficAddRequest {
  bytes id = 1 [(orm.field) = {type: TYPE_UUID}];
  TenantRef tenant = 2;
  AppRef app = 8;
  PlacementRef placement = 9;
  string session = 10 [features.field_presence = IMPLICIT];
  uint64 sequence = 11 [features.field_presence = IMPLICIT];
  uint32 active = 12 [features.field_presence = IMPLICIT];
  uint64 started = 16 [features.field_presence = IMPLICIT];
  uint64 busy_ms = 17 [features.field_presence = IMPLICIT];
  bool closed = 18 [features.field_presence = IMPLICIT];
  bool draining = 19 [features.field_presence = IMPLICIT];
  uint64 date_seen = 20 [features.field_presence = IMPLICIT];
  uint64 revision = 21 [features.field_presence = IMPLICIT];
  bool activation = 22 [features.field_presence = IMPLICIT];
}

message TrafficGetRequest {
  TrafficRef ref = 1;
  TrafficSelect select = 2;
}

message TrafficRef {
  oneof key {
    bytes id = 1 [(orm.field) = {type: TYPE_UUID}];
  }
}

message TrafficSelect {
  bool all = 1;
  TenantSelect tenant = 2;
  AppSelect app = 8;
  PlacementSelect placement = 9;
  bool session = 10;
  bool sequence = 11;
  bool active = 12;
  bool started = 16;
  bool busy_ms = 17;
  bool closed = 18;
  bool draining = 19;
  bool date_seen = 20;
  bool revision = 21;
  bool activation = 22;
}

message TrafficListRequest {
  // Bounded because the work is: each filter is a predicate in the same query,
  // so this is what says how much of the database one request may read.
  repeated TrafficFilter filters = 1;

  // How many to answer with. Nothing said is what the schema declared, and more
  // than the cap is the cap -- a caller asking for more than there is meant no
  // harm, so it is not an error and it is not the whole table either.
  int32 size = 2 [features.field_presence = IMPLICIT];

  // Where to carry on from: the "next" of the answer before. It names the last
  // row of that page rather than counting rows from the start, so a row added
  // ahead of the page does not shift it and a caller reading through never sees
  // one twice or misses one.
  string after = 3 [features.field_presence = IMPLICIT];

  // Read the order the other way round, every column of it at once -- newest
  // first where it is oldest first -- which the index the order walks walks
  // from the other end. A cursor is of the way it was read, so the next page
  // carries on that way, and one of the other way is refused.
  bool reverse = 4 [features.field_presence = IMPLICIT];
}

message TrafficListResponse {
  repeated Traffic items = 1;

  // What to ask for next, and empty when this was the last of them.
  //
  // Empty means there is no more *for now*: a list is read as it is, and one
  // that has grown since answers a fresh call. It is not empty merely because
  // the page came back short -- a page is short when the last row of it was the
  // last row there was, which is a thing the server can only know by having
  // looked.
  string next = 2 [features.field_presence = IMPLICIT];
}

message TrafficFilter {
  TrafficRef ref = 1;
  AppRef app = 2;
}

message TrafficReportRequest {
  TrafficRef ref = 1;
  uint64 sequence = 2 [features.field_presence = IMPLICIT];
  uint32 active = 3 [features.field_presence = IMPLICIT];
  uint64 started = 4 [features.field_presence = IMPLICIT];
  uint64 busy_ms = 5 [features.field_presence = IMPLICIT];
  bool closed = 6 [features.field_presence = IMPLICIT];
}

message TrafficCloseRequest {
  TrafficRef ref = 1;
  bool withdrawn = 2 [features.field_presence = IMPLICIT];
}
