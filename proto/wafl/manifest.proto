edition = "2023";
package wafl;

option go_package = "github.com/lesomnus/wafl/proto/wafl";
option features.field_presence = IMPLICIT;

// Execution settings carried by Instance. The archive contains code and data;
// it does not contain another manifest.
message Manifest {
  // Currently "wasmtime". Empty also selects wasmtime.
  string runtime = 1;
  // HTTP(S) or local file tar.gz: main.wasm and optional data/ mounted as /data.
  Asset bundle = 2;
  // Legacy primary guest port, 1..65535 (CLI/controller default: 8080).
  uint32 port = 3;
  // Legacy "http" (default), "h2c" (HTTP/2 including gRPC), or "tcp".
  string protocol = 4;
  // Currently "wasip2"; main.wasm must be a WASI CLI component.
  string abi = 5;
  // Zero selects the defaults: 60000, 10000, 67108864, and 128 respectively.
  // Direct runners require idle_ms/max_active=0 and leave them zero: gateways
  // own request accounting and retirement. Startup and memory limits still apply.
  uint64 idle_ms = 6;
  uint64 startup_ms = 7;
  uint64 memory_bytes = 8;
  uint32 max_active = 9;
  map<string, string> env = 10;
  repeated Binding bindings = 11;
  // Named ingress sockets. Omit to use legacy port/protocol. With sockets,
  // legacy fields may only repeat the first socket. All sockets must listen
  // before the execution becomes ready. Currently TCP only, at most 16.
  repeated Socket sockets = 12;
}

message Socket {
  // Unique lowercase name, 1..15 letters/digits/hyphens, starting with a letter
  // and ending with a letter or digit.
  string name = 1;
  uint32 port = 2;
  // "tcp" (default). Other transports are rejected until implemented.
  string transport = 3;
  // Empty is an opaque byte stream; "http" and "h2c" enable HTTP routing.
  string protocol = 4;
}

message Asset {
  oneof kind {
    string url = 1;
  }
  // Optional expected digest of the compressed bundle: sha256:<64 lowercase hex>.
  // A digest selects immutable cached content independently of its source URL.
  string digest = 2;
}

// Map a guest loopback TCP port to a runner-reachable IPv4 socket.
message Binding {
  uint32 port = 1;
  string target = 2;
}
