edition = "2023";
package wafl;

option go_package = "github.com/lesomnus/wafl/proto/wafl";
option features.field_presence = IMPLICIT;

// Runner-local operations. A deployment controller owns artifact distribution and
// manifest registration; this service observes and manages the configured apps.
service RunnerService {
  rpc List(ListRequest) returns (ListResponse);
  rpc Get(GetRequest) returns (Instance);
  // Idempotently prepare an instance; requests also start it automatically.
  rpc Start(StartRequest) returns (Instance);
  // Stop an idle instance. Active requests cause FAILED_PRECONDITION.
  // A later request starts a fresh instance; this does not disable the app.
  rpc Stop(StopRequest) returns (Instance);
}

message ListRequest {}
message ListResponse { repeated Instance items = 1; }
message GetRequest { string name = 1; }
message StartRequest { string name = 1; }
message StopRequest { string name = 1; }

message Instance {
  string name = 1;
  Phase phase = 2;
  // Monotonic start attempt within this runner process, including failed starts.
  uint64 generation = 3;
  uint32 active = 4;
  string error = 5;
  string domain = 6;
  uint32 port = 7;
}

enum Phase {
  PHASE_UNSPECIFIED = 0;
  PHASE_STOPPED = 1;
  PHASE_STARTING = 2;
  PHASE_RUNNING = 3;
  PHASE_FAILED = 4;
  PHASE_STOPPING = 5;
}
