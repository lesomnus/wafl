edition = "2023";
package wafl;
option go_package = "github.com/lesomnus/wafl/proto/wafl";
option features.field_presence = IMPLICIT;

// Source reference only. Resolved contents never enter App or Placement storage.
message Secret {
  string env = 1;
  oneof source {
    // Local CLI input only, relative to the App YAML file. The CLI sends the
    // contents through App.secret_values, never the local path to the server.
    string file = 2;
    // A source in the App tenant's Kubernetes namespace.
    SecretKeyRef secret_key_ref = 3;
  }
}

// Kubernetes core/v1 SecretKeySelector semantics; namespace is never caller-set.
message SecretKeyRef {
  string name = 1;
  string key = 2;
  bool optional = 3;
}
