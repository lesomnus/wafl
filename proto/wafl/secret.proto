edition = "2023";
package wafl;
option go_package = "github.com/lesomnus/wafl/proto/wafl";
option features.field_presence = IMPLICIT;

// Source reference only. Resolved contents never enter App or Placement storage.
message Secret {
  string env = 1;
  oneof source {
    // Relative to the tenant's controller-configured secret directory.
    string file = 2;
    // Only for Kubernetes-owned Apps, in the owning App's namespace.
    SecretKeyRef secret_key_ref = 3;
  }
}

// Kubernetes core/v1 SecretKeySelector semantics; namespace is never caller-set.
message SecretKeyRef {
  string name = 1;
  string key = 2;
  bool optional = 3;
}
