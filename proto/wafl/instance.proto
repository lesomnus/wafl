edition = "2023";
package wafl;

import "payday.proto";
import "orm.proto";
import "wafl/manifest.proto";
import "wafl/payday/tenant.proto";

option go_package = "github.com/lesomnus/wafl/proto/wafl";
option features.field_presence = IMPLICIT;

// A tenant's runner-local execution state. The runner layer implements this
// entity's service from memory; choosing that layer does not change its contract.
message Instance {
  option (orm.message) = {rpc: {add: {}, get: {}, erase: {}}};
  option (payday.entity) = {
    domain: 7
    list: {
      order: [{field: {name: "id"}}]
      by: [{name: "ref"}]
      size: 100
      max: 1000
      filters: 64
    }
    erase: {hard: {}}
  };

  bytes id = 1 [(orm.field) = {type: TYPE_UUID, key: true, default: ""}];
  Tenant tenant = 2 [(orm.edge) = {immutable: true}];
  // Runner-local name. API values omit @; the CLI uses @alias references.
  string alias = 4 [(orm.field) = {unique: true, default: ""}];
  string name = 5;
  Phase phase = 8 [(payday.field) = {stamped: true}];
  // Monotonic start attempt within this runner process, including failed starts.
  uint64 generation = 9 [(payday.field) = {stamped: true}];
  uint32 active = 10 [(payday.field) = {stamped: true}];
  string error = 11 [(payday.field) = {stamped: true}];
  reserved 12, 16;
  reserved domain, port;
  Manifest manifest = 17 [(orm.field) = {type: TYPE_JSON, immutable: true}];
  // Domain-8 Runner ID; changes whenever the runner process restarts.
  bytes session = 18 [(orm.field) = {type: TYPE_UUID}, (payday.field) = {stamped: true}];
  // Runner-wide monotonic lifecycle revision; not a request count or CP lease.
  uint64 revision = 19 [(payday.field) = {stamped: true}];
  bool draining = 20 [(payday.field) = {stamped: true}];
}

enum Phase {
  PHASE_UNSPECIFIED = 0;
  PHASE_STOPPED = 1;
  PHASE_STARTING = 2;
  PHASE_RUNNING = 3;
  PHASE_FAILED = 4;
  PHASE_STOPPING = 5;
  PHASE_PREPARING = 6;
}
