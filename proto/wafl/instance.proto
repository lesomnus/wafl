edition = "2023";
package wafl;

import "payday.proto";
import "orm.proto";
import "wafl/payday/tenant.proto";

option go_package = "github.com/lesomnus/wafl/proto/wafl";
option features.field_presence = IMPLICIT;

// A tenant's runner-local execution state. The runner layer implements this
// entity's service from memory; choosing that layer does not change its contract.
message Instance {
  option (orm.message) = {rpc: {get: {}}};
  option (payday.entity) = {
    domain: 7
    list: {
      order: [{field: {name: "id"}}]
      by: [{name: "ref"}]
      size: 100
      max: 1000
      filters: 64
    }
    erase: {hard: {}}
    trail: {off: {why: "Ephemeral execution state served by the runner layer; no persistent writes"}}
  };

  bytes id = 1 [(orm.field) = {type: TYPE_UUID, key: true}];
  Tenant tenant = 2 [(orm.edge) = {immutable: true}];
  string name = 5;
  Phase phase = 8;
  // Monotonic start attempt within this runner process, including failed starts.
  uint64 generation = 9;
  uint32 active = 10;
  string error = 11;
  string domain = 12;
  uint32 port = 16;
}

enum Phase {
  PHASE_UNSPECIFIED = 0;
  PHASE_STOPPED = 1;
  PHASE_STARTING = 2;
  PHASE_RUNNING = 3;
  PHASE_FAILED = 4;
  PHASE_STOPPING = 5;
}
