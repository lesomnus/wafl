edition = "2023";
package wafl;
import "payday.proto";
import "orm.proto";
import "wafl/manifest.proto";
import "wafl/app_source.proto";
import "wafl/secret.proto";
import "wafl/payday/tenant.proto";
option go_package = "github.com/lesomnus/wafl/proto/wafl";
option features.field_presence = IMPLICIT;

// AppService is the platform management API. The controller stores declarations
// in Kubernetes; clients do not need Kubernetes credentials or object types.
// The declarative fields also generate the App CRD spec for cluster operators.
message App {
  option (orm.message) = {rpc: {add: {}, get: {}, patch: {}, erase: {}}};
  option (payday.entity) = {
    domain: 10 erase: {hard: {}}
    list: {order: [{field: {name: "id"}}] by: [{name: "ref"}] size: 100 max: 1000 filters: 64}
  };
  bytes id = 1 [(orm.field) = {type: TYPE_UUID, key: true, default: ""}];
  Tenant tenant = 2 [(orm.edge) = {immutable: true}];
  string alias = 4 [(orm.field) = {unique: true, default: ""}];
  string name = 5;
  // HTTP Apps: one exact lowercase ASCII DNS hostname. TCP Apps omit domain
  // and publish listeners instead. No wildcards, ports or rule syntax.
  string domain = 8 [(orm.field) = {unique: true, immutable: true}];
  uint32 replicas = 9;
  uint64 revision = 10 [(payday.field) = {stamped: true}];
  Manifest manifest = 16 [(orm.field) = {type: TYPE_JSON}];
  // Optional concurrency autoscaling: HTTP requests or TCP connections.
  // replicas is used only without it.
  Scaling scaling = 17 [(orm.field) = {type: TYPE_JSON, nullable: true}];
  ScaleState state = 18 [(orm.field) = {type: TYPE_JSON, nullable: true}, (payday.field) = {stamped: true}];
  // Legacy importer ownership; unused by the Kubernetes-native controller.
  AppSource source = 19 [(orm.edge) = {nullable: true, immutable: true}, (payday.field) = {stamped: true}];
  // Source references only; Kubernetes binds immutable Secret snapshots to Pods.
  repeated Secret secrets = 20 [(orm.field) = {type: TYPE_JSON, default: ""}];
  // Kubernetes readiness; omitted means TCP listener readiness.
  Probe readiness = 21 [(orm.field) = {type: TYPE_JSON, nullable: true}];
  Rollout rollout = 22 [(orm.field) = {type: TYPE_JSON, nullable: true}];
  // Write-only environment values. The controller stores these as Secret
  // sources and returns references in secrets. Never stored in the App CRD.
  map<string, string> secret_values = 23 [(orm.field) = {type: TYPE_JSON, default: ""}, (payday.field) = {secret: true}];
  AppStatus status = 24 [(orm.field) = {type: TYPE_JSON, nullable: true}, (payday.field) = {stamped: true}];
  // TCP entrypoints on the platform's configured public port pool. Immutable
  // for an App's lifetime; backend socket manifests may change on rollout.
  repeated Listener listeners = 25 [(orm.field) = {type: TYPE_JSON, immutable: true}];
}

message Listener {
  // Manifest socket name, or "app" for the legacy port/protocol declaration.
  string socket = 1;
  uint32 port = 2;
}

message AppStatus {
  uint32 ready = 1;
  bool accepted = 2;
  string reason = 3;
  string message = 4;
}

message Probe {
  oneof kind {
    string http = 1;
    string grpc = 2;
  }
  uint32 period_seconds = 3;
  uint32 timeout_seconds = 4;
  uint32 failures = 5;
  uint32 successes = 6;
}

message Rollout {
  uint32 surge = 1;
  uint32 unavailable = 2;
  uint64 drain_ms = 3;
}

message Scaling {
  uint32 min = 1;
  uint32 max = 2;
  uint32 target = 3;
  uint64 up_ms = 4;
  uint64 down_ms = 5;
  uint64 idle_ms = 6;
  uint32 waiting = 7;
  uint64 wait_ms = 8;
}

// Controller observations and decisions. Times are Unix milliseconds.
message ScaleState {
  uint32 desired = 1;
  uint32 active = 2;
  uint32 waiting = 3;
  double load = 4;
  bool fresh = 5;
  uint64 date_activity = 6;
  uint64 date_change = 7;
  uint64 date_sample = 8;
  uint64 high_ms = 9;
  uint64 low_ms = 10;
  uint64 started = 11;
  uint64 busy_ms = 12;
}
