edition = "2023";
package wafl;
import "payday.proto";
import "orm.proto";
import "wafl/manifest.proto";
import "wafl/app_source.proto";
import "wafl/payday/tenant.proto";
option go_package = "github.com/lesomnus/wafl/proto/wafl";
option features.field_presence = IMPLICIT;

// Controller-owned desired state. A manifest or fixed/scaling mode change creates a new revision;
// placements retain that revision's manifest until explicitly released.
message App {
  option (orm.message) = {rpc: {add: {}, get: {}, patch: {}, erase: {}}};
  option (payday.entity) = {
    domain: 10 erase: {hard: {}}
    list: {order: [{field: {name: "id"}}] by: [{name: "ref"}] size: 100 max: 1000 filters: 64}
  };
  bytes id = 1 [(orm.field) = {type: TYPE_UUID, key: true, default: ""}];
  Tenant tenant = 2 [(orm.edge) = {immutable: true}];
  string alias = 4 [(orm.field) = {unique: true, default: ""}];
  string name = 5;
  // One exact DNS hostname, lowercase ASCII. No wildcards, ports or rule syntax.
  string domain = 8 [(orm.field) = {unique: true, immutable: true}];
  uint32 replicas = 9;
  uint64 revision = 10 [(payday.field) = {stamped: true}];
  Manifest manifest = 16 [(orm.field) = {type: TYPE_JSON}];
  // Optional request-concurrency autoscaling; replicas is used only without it.
  Scaling scaling = 17 [(orm.field) = {type: TYPE_JSON, nullable: true}];
  ScaleState state = 18 [(orm.field) = {type: TYPE_JSON, nullable: true}, (payday.field) = {stamped: true}];
  // Set only by a configured provider. Such apps are read-only through AppService.
  AppSource source = 19 [(orm.edge) = {nullable: true, immutable: true}, (payday.field) = {stamped: true}];
}

message Scaling {
  uint32 min = 1;
  uint32 max = 2;
  uint32 target = 3;
  uint64 up_ms = 4;
  uint64 down_ms = 5;
  uint64 idle_ms = 6;
  uint32 waiting = 7;
  uint64 wait_ms = 8;
}

// Controller observations and decisions. Times are Unix milliseconds.
message ScaleState {
  uint32 desired = 1;
  uint32 active = 2;
  uint32 waiting = 3;
  double load = 4;
  bool fresh = 5;
  uint64 date_activity = 6;
  uint64 date_change = 7;
  uint64 date_sample = 8;
  uint64 high_ms = 9;
  uint64 low_ms = 10;
  uint64 started = 11;
  uint64 busy_ms = 12;
}
