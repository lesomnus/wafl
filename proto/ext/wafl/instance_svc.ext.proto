edition = "2023";
package wafl;

import "wafl/instance.proto";
import "wafl/log.proto";

option go_package = "github.com/lesomnus/wafl/proto/wafl";

// Add/Get/List/Erase come from the entity declaration. Runtime actions and log
// streaming extend the generated service.
service InstanceService {
  // Reuse a running instance or wait for the shared startup attempt.
  rpc Start(InstanceStartRequest) returns (Instance);
  // Proxy mode: refuse active requests; a later request starts the instance again.
  // Direct mode: requires the endpoint reservation to have been Released first.
  rpc Stop(InstanceStopRequest) returns (Instance);
  // Proxy mode: close admission, finish requests, then stop. Start resumes it.
  // Direct mode: mark draining and return; gateways withdraw before Release.
  rpc Drain(InstanceDrainRequest) returns (Instance);
  // Direct mode only. Acknowledge that ALL gateways have withdrawn this
  // generation and closed/drained their connections, then stop and free its
  // endpoint reservation. Requires prior Drain and wafl-session/wafl-revision.
  // The supervisor completes even if the RPC caller disconnects.
  rpc Release(InstanceReleaseRequest) returns (Instance);
  // Fence all future Add calls for this ID in the current runner session.
  // Does not interrupt an already published execution; Drain/Release still
  // apply. Allows safe Erase after release despite delayed controller calls.
  rpc Seal(InstanceSealRequest) returns (InstanceSealResponse);
  // Read retained stdout/stderr, optionally following across Stop/Start.
  rpc Tail(InstanceTailRequest) returns (stream Log);
}

message InstanceStartRequest { InstanceRef ref = 1; }
message InstanceStopRequest { InstanceRef ref = 1; }
message InstanceSealRequest { bytes id = 1; }
message InstanceSealResponse { bool sealed = 1 [features.field_presence = IMPLICIT]; }

message InstanceReleaseRequest {
  InstanceRef ref = 1;
  uint64 generation = 2 [features.field_presence = IMPLICIT];
}

// Mutations accept optional wafl-session (Runner UUID) and wafl-revision
// (decimal Instance.revision) RPC metadata. Add only accepts wafl-session.
// Revision requires session; check and mutation are atomic in the runner.
// Release requires both, rather than treating them as optional.
message InstanceDrainRequest {
  InstanceRef ref = 1;
  // Proxy mode: zero uses the runner default. Maximum 600000 ms.
  // Direct mode: must be zero.
  uint64 timeout_ms = 2 [features.field_presence = IMPLICIT];
  // Proxy mode: on expiry, terminate the guest and interrupt remaining requests.
  // Direct mode: must be false.
  bool force = 3 [features.field_presence = IMPLICIT];
}
// In direct mode Drain only sets draining=true and returns immediately; the
// guest remains live for existing traffic. timeout_ms and force must be zero.
// The controller withdraws all routes/pools, drains streams, then calls Release.

message InstanceTailRequest {
  InstanceRef ref = 1;
  bool follow = 2 [features.field_presence = IMPLICIT];
  // Resume strictly beyond this sequence. Zero starts with retained history.
  uint64 cursor = 3 [features.field_presence = IMPLICIT];
  // Initial history records, not lines. Zero returns all retained records.
  uint32 limit = 4 [features.field_presence = IMPLICIT];
}
